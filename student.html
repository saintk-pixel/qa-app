<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 답변 입력</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
  :root{--bg:#f8f9ff;--card:#ffffff;--accent:#4f6ef7;--accent-dark:#3a56d4;--text:#1a1d2e;--muted:#8b90a7;--border:#e4e6f0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(79,110,247,0.08) 0%,transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(79,110,247,0.05) 0%,transparent 55%);pointer-events:none;}
  .box{position:relative;background:var(--card);border-radius:24px;padding:48px 40px;width:100%;max-width:480px;box-shadow:0 8px 48px rgba(79,110,247,0.1),0 2px 8px rgba(0,0,0,0.06);animation:fadeUp 0.5s ease;}
  .top-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(79,110,247,0.08);color:var(--accent);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:20px;}
  .top-badge::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 1.5s infinite;}
  .q-label{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
  .q-text{font-size:22px;font-weight:800;line-height:1.4;color:var(--text);margin-bottom:32px;min-height:32px;}
  .field{margin-bottom:16px;}
  .field label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:7px;}
  .field input,.field textarea{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);padding:14px 16px;font-family:'Noto Sans KR',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
  .field textarea{resize:none;overflow:hidden;min-height:96px;line-height:1.7;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,110,247,0.1);}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted);}
  .submit-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.2s;margin-top:8px;}
  .submit-btn:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,110,247,0.3);}
  .submit-btn:disabled{background:var(--muted);cursor:not-allowed;transform:none;box-shadow:none;}
  #done-screen{display:none;text-align:center;animation:fadeUp 0.5s ease;}
  .done-icon{width:80px;height:80px;background:rgba(34,197,94,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;animation:pop 0.4s ease;}
  #done-screen h2{font-size:24px;font-weight:800;margin-bottom:10px;}
  #done-screen p{font-size:14px;color:var(--muted);line-height:1.7;}
  .done-name{color:var(--accent);font-weight:700;}
  .submitted-box{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:16px;margin-top:22px;text-align:left;}
  .submitted-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:0.5px;}
  .submitted-text{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--text);}
  .edit-btn{width:100%;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:14px;padding:14px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:14px;}
  .edit-btn:hover{background:var(--accent);color:#fff;}
  .err-msg{font-size:12px;color:#ef4444;margin-top:5px;display:none;}
  .loading{display:none;text-align:center;padding:16px 0;color:var(--muted);font-size:14px;}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 8px;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes pop{0%{transform:scale(0.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:480px){.box{padding:36px 24px;border-radius:20px;}.q-text{font-size:19px;}}
</style>
</head>
<body>
<div class="box">
  <div id="form-screen">
    <div class="top-badge">응답 수집 중</div>
    <div class="q-label">질문</div>
    <div class="q-text" id="q-text">질문을 불러오는 중...</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="name-input" placeholder="이름을 입력하세요" maxlength="20"/>
      <div class="err-msg" id="name-err">이름을 입력해주세요</div>
    </div>
    <div class="field">
      <label>답변</label>
      <textarea id="ans-input" rows="3" placeholder="여기에 입력하세요 (엔터로 줄바꿈)"></textarea>
      <div id="char-count" style="font-size:12px;color:var(--muted);text-align:right;margin-top:6px;">0 / 2000자</div>
      <div class="err-msg" id="ans-err">답변을 입력해주세요</div>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div>전송 중...</div>
    <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">제출하기 →</button>
  </div>
  <div id="done-screen">
    <div class="done-icon">✅</div>
    <h2>제출 완료!</h2>
    <p><span class="done-name" id="done-name"></span>님의 답변이<br>선생님께 전달되었습니다 😊</p>

    <div class="submitted-box">
      <div class="submitted-label">제출한 답변</div>
      <div class="submitted-text" id="done-answer"></div>
    </div>

    <p style="margin-top:18px;">내용을 확인해보세요.<br>고칠 부분이 있으면 수정할 수 있어요.</p>
    <button class="edit-btn" onclick="editAnswer()">✏️ 답변 수정하기</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8BsU58o14UnrGr39gBZrrOapzFWjNg-U",
  authDomain: "sj-kwon.firebaseapp.com",
  databaseURL: "https://sj-kwon-default-rtdb.firebaseio.com",
  projectId: "sj-kwon",
  storageBucket: "sj-kwon.firebasestorage.app",
  messagingSenderId: "857689120558",
  appId: "1:857689120558:web:eb50476c86701d272764bf"
};

// ✅ Apps Script URL (구글 시트 저장용)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxO2Q3zBj7RkEi8jcR0MO0btfVN8CHTgQjvNl2K1lqwZobos6liBX0q2PnONdQkATQP/exec";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// 익명 인증 → 성공 후에만 질문 불러오기 (학생은 로그인할 필요 없음)
document.getElementById('submit-btn').disabled = true;
document.getElementById('q-text').textContent = '불러오는 중…';

signInAnonymously(auth)
  .then(loadQuestion)
  .catch(e => {
    console.error('[익명 인증 실패]', e.code);
    document.getElementById('q-text').textContent =
      '⚠️ 접속할 수 없습니다. 선생님께 알려주세요. (' + e.code + ')';
  });

// 내가 제출한 답변 ID — 재제출 시 덮어쓰기용
const STORE_KEY = 'myAnswerId';
let myAnswerId = null;
try { myAnswerId = localStorage.getItem(STORE_KEY); } catch(e){}

// 답변창 자동 높이 조절 (줄 수 제한 없음)
const ansEl = document.getElementById('ans-input');
const MAX_LEN = 2000;
function autoGrow(){
  ansEl.style.height = 'auto';
  ansEl.style.height = ansEl.scrollHeight + 'px';
  const c = document.getElementById('char-count');
  if(c) c.textContent = ansEl.value.length + ' / ' + MAX_LEN + '자';
}
ansEl.addEventListener('input', autoGrow);

function loadQuestion(){
  get(ref(db,'config/question')).then(snap => {
    if(snap.exists() && snap.val()) {
      document.getElementById('q-text').textContent = snap.val();
      document.getElementById('submit-btn').disabled = false;
    } else {
      document.getElementById('q-text').textContent = '선생님이 아직 질문을 설정하지 않았습니다.';
    }
  }).catch(e => {
    console.error('[Firebase]', e);
    document.getElementById('q-text').textContent = '⚠️ 서버에 연결할 수 없습니다. 선생님께 알려주세요.';
  });

  get(ref(db,'config/hint')).then(snap => {
    if(snap.exists() && snap.val()) {
      document.getElementById('ans-input').placeholder = snap.val();
    }
  }).catch(e => console.warn('[hint]', e));
}

window.submitAnswer = async () => {
  const name = document.getElementById('name-input').value.trim();
  const answer = document.getElementById('ans-input').value.trim();
  let valid = true;
  if(!name){document.getElementById('name-err').style.display='block';valid=false;}
  else document.getElementById('name-err').style.display='none';
  const ansErrEl = document.getElementById('ans-err');
  if(!answer){ ansErrEl.textContent='답변을 입력해주세요'; ansErrEl.style.display='block'; valid=false; }
  else if(answer.length > 2000){ ansErrEl.textContent='답변은 2000자까지 입력할 수 있어요 (현재 '+answer.length+'자)'; ansErrEl.style.display='block'; valid=false; }
  else ansErrEl.style.display='none';
  if(!valid)return;

  const question = document.getElementById('q-text').textContent;
  document.getElementById('loading').style.display='block';
  document.getElementById('submit-btn').disabled=true;

  const payload = {
    name, answer, question,
    timestamp: Date.now(),
    uid: auth.currentUser.uid
  };

  try {
    if(myAnswerId){
      // 재제출 → 기존 답변 덮어쓰기 (선생님 화면에 중복 안 생김)
      await set(ref(db, 'answers/' + myAnswerId), payload);
    } else {
      // 최초 제출
      const newRef = await push(ref(db,'answers'), payload);
      myAnswerId = newRef.key;
      try { localStorage.setItem(STORE_KEY, myAnswerId); } catch(e){}
    }

    // 구글 시트 저장 (기록 보관용)
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'addAnswer', name, answer, question })
    }).catch(e => console.warn('시트 저장 오류:', e));

    // 완료 화면 — 제출한 내용 그대로 보여주기
    document.getElementById('done-name').textContent = name;
    document.getElementById('done-answer').textContent = answer;
    document.getElementById('loading').style.display='none';
    document.getElementById('submit-btn').disabled=false;
    document.getElementById('form-screen').style.display='none';
    document.getElementById('done-screen').style.display='block';
    window.scrollTo(0,0);

  } catch(e) {
    console.error('[제출 오류]', e);
    document.getElementById('loading').style.display='none';
    document.getElementById('submit-btn').disabled=false;
    alert('전송 오류가 발생했습니다. 다시 시도해주세요.');
  }
};

// ── 답변 수정하기 ──
window.editAnswer = () => {
  document.getElementById('done-screen').style.display='none';
  document.getElementById('form-screen').style.display='block';
  document.getElementById('submit-btn').textContent = '수정한 답변 제출하기';
  document.getElementById('ans-input').focus();
  autoGrow();
  window.scrollTo(0,0);
};
</script>
</body>
</html>
