<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👨‍🏫 선생님 대시보드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap');
  :root{--bg:#0d1117;--surface:#161b22;--card:#21262d;--accent:#58a6ff;--accent2:#3fb950;--accent3:#f78166;--text:#e6edf3;--muted:#7d8590;--border:#30363d;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(88,166,255,0.06) 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(63,185,80,0.05) 0%,transparent 60%);pointer-events:none;}
  .wrap{position:relative;max-width:820px;margin:0 auto;padding:32px 20px;}
  .hd{display:flex;align-items:center;gap:14px;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border);}
  .hd-icon{font-size:32px;}.hd h1{font-size:22px;font-weight:800;}.hd p{font-size:13px;color:var(--muted);margin-top:2px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;}
  .card h2{font-size:15px;font-weight:700;margin-bottom:16px;}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 14px;font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
  input:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:none;line-height:1.6;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .btn{padding:11px 22px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
  .btn-blue{background:var(--accent);color:#000;}.btn-blue:hover{filter:brightness(1.15);transform:translateY(-1px);}
  .btn-green{background:var(--accent2);color:#000;}.btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-ghost:hover{color:var(--text);border-color:var(--muted);}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn-red{background:rgba(247,129,102,0.15);color:var(--accent3);border:1px solid rgba(247,129,102,0.3);}.btn-red:hover{background:rgba(247,129,102,0.25);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;}
  .dot.ok{background:var(--accent2);box-shadow:0 0 5px var(--accent2);}.dot.err{background:var(--accent3);}
  .link-box{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .link-box .url{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);word-break:break-all;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
  .stat .num{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--accent);display:block;}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;display:block;}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--card);color:var(--muted);font-weight:600;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;}
  tr:last-child td{border-bottom:none;}tr:hover td{background:rgba(88,166,255,0.04);}
  .empty-row td{text-align:center;color:var(--muted);padding:40px;}
  .active-q-box{background:rgba(63,185,80,0.08);border:1px solid rgba(63,185,80,0.3);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:none;}
  .active-q-box .albl{font-size:11px;color:var(--accent2);font-weight:700;margin-bottom:4px;}
  .active-q-box .qtxt{font-size:15px;font-weight:700;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--accent2);color:#000;padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;display:none;z-index:99;}
  .conn-bar{font-size:12px;color:var(--muted);margin-top:4px;}
  @media(max-width:500px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="hd-icon">👨‍🏫</div>
    <div>
      <h1>선생님 대시보드</h1>
      <p>질문을 설정하고 학생 답변을 실시간으로 확인하세요</p>
    </div>
  </div>

  <!-- 질문 설정 -->
  <div class="card">
    <h2>✏️ 질문 설정</h2>
    <div class="active-q-box" id="active-q-box">
      <div class="albl">✅ 현재 활성 질문</div>
      <div class="qtxt" id="active-q-txt"></div>
    </div>
    <div style="margin-bottom:14px;"><label>새 질문 입력</label><textarea id="question-text" rows="2" placeholder="예) 이메일 주소를 입력해주세요."></textarea></div>
    <div style="margin-bottom:16px;"><label>입력 힌트 (선택)</label><input id="question-hint" placeholder="예) example@gmail.com" /></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-blue" onclick="saveQuestion()">💾 질문 저장 & 활성화</button>
      <button class="btn btn-ghost btn-sm" onclick="clearQuestion()">질문 초기화</button>
    </div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <label>📎 학생 공유 링크</label>
      <div class="link-box">
        <span class="url" id="student-link"></span>
        <button class="btn btn-green btn-sm" onclick="copyLink()">📋 복사</button>
      </div>
    </div>
  </div>

  <!-- 답변 현황 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="margin-bottom:0;">📊 답변 현황</h2>
        <div class="conn-bar"><span class="dot" id="conn-dot"></span><span id="conn-txt">연결 중...</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-red btn-sm" onclick="clearAll()">🗑 전체 삭제</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="cnt-total">0</span><span class="lbl">전체 답변</span></div>
      <div class="stat"><span class="num" id="cnt-today">0</span><span class="lbl">오늘 답변</span></div>
      <div class="stat"><span class="num" id="cnt-q" style="color:var(--accent2);font-size:14px;padding-top:8px;">—</span><span class="lbl">현재 질문</span></div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>이름</th><th>답변</th><th>제출 시간</th><th></th></tr></thead>
        <tbody id="answer-tbody"><tr class="empty-row"><td colspan="5">아직 답변이 없습니다</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8BsU58o14UnrGr39gBZrrOapzFWjNg-U",
  authDomain: "sj-kwon.firebaseapp.com",
  databaseURL: "https://sj-kwon-default-rtdb.firebaseio.com",
  projectId: "sj-kwon",
  storageBucket: "sj-kwon.firebasestorage.app",
  messagingSenderId: "857689120558",
  appId: "1:857689120558:web:eb50476c86701d272764bf",
  measurementId: "G-7FPJPFZ7C5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 학생 링크 설정
const base = location.href.replace('teacher.html','student.html').split('?')[0];
document.getElementById('student-link').textContent = base;

// 현재 질문 불러오기
const qRef = ref(db, 'config/question');
const hRef = ref(db, 'config/hint');
get(qRef).then(snap => {
  if(snap.exists()) {
    const q = snap.val();
    document.getElementById('question-text').value = q;
    showAQ(q);
  }
});
get(hRef).then(snap => {
  if(snap.exists()) document.getElementById('question-hint').value = snap.val();
});

// 질문 저장
window.saveQuestion = async () => {
  const q = document.getElementById('question-text').value.trim();
  const hint = document.getElementById('question-hint').value.trim();
  if(!q){alert('질문을 입력해주세요!');return;}
  await set(ref(db,'config/question'), q);
  await set(ref(db,'config/hint'), hint);
  showAQ(q);
  showToast('✅ 질문이 저장되었습니다!');
};

window.clearQuestion = async () => {
  if(!confirm('질문을 초기화할까요?'))return;
  await set(ref(db,'config/question'),'');
  await set(ref(db,'config/hint'),'');
  document.getElementById('question-text').value='';
  document.getElementById('question-hint').value='';
  document.getElementById('active-q-box').style.display='none';
};

function showAQ(q){
  document.getElementById('active-q-box').style.display='block';
  document.getElementById('active-q-txt').textContent=q;
  document.getElementById('cnt-q').textContent=q.length>12?q.slice(0,12)+'…':q;
}

// 답변 실시간 감지
const answersRef = ref(db,'answers');
onValue(answersRef, (snap) => {
  const data = snap.val();
  const answers = data ? Object.entries(data).map(([id,v])=>({id,...v})) : [];
  answers.sort((a,b)=>b.timestamp-a.timestamp);
  renderAnswers(answers);
  setConn('ok',`실시간 연결 · ${answers.length}개`);
}, (err) => {
  setConn('err','연결 오류');
});

function renderAnswers(answers){
  const todayStr = new Date().toISOString().slice(0,10);
  const todayCount = answers.filter(a=>new Date(a.timestamp).toISOString().slice(0,10)===todayStr).length;
  document.getElementById('cnt-total').textContent=answers.length;
  document.getElementById('cnt-today').textContent=todayCount;
  const tb=document.getElementById('answer-tbody');
  if(!answers.length){tb.innerHTML='<tr class="empty-row"><td colspan="5">아직 답변이 없습니다</td></tr>';return;}
  tb.innerHTML=answers.map((a,i)=>`
    <tr>
      <td style="color:var(--muted);font-size:12px;">${answers.length-i}</td>
      <td style="font-weight:600;">${esc(a.name)}</td>
      <td>${esc(a.answer)}</td>
      <td style="color:var(--muted);font-size:12px;white-space:nowrap;">${formatTime(a.timestamp)}</td>
      <td><button class="btn btn-red btn-sm" onclick="delAnswer('${a.id}')">✕</button></td>
    </tr>
  `).join('');
}

window.delAnswer = async (id) => {
  if(!confirm('삭제할까요?'))return;
  await remove(ref(db,`answers/${id}`));
};

window.clearAll = async () => {
  if(!confirm('모든 답변을 삭제할까요?'))return;
  await remove(ref(db,'answers'));
  showToast('🗑 전체 삭제 완료');
};

window.copyLink = () => {
  const url = document.getElementById('student-link').textContent;
  navigator.clipboard.writeText(url).then(()=>showToast('📋 링크 복사됨!'));
};

function setConn(s,m){
  document.getElementById('conn-dot').className='dot '+(s==='ok'?'ok':'err');
  document.getElementById('conn-txt').textContent=m;
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatTime(ts){return new Date(ts).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
</script>
</body>
</html>
